<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1080px; }
  .stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; padding: 100px; }
  .badge { display: inline-block; padding: 18px 32px; background: rgba(255,255,255,0.18); backdrop-filter: blur(30px); border: 1.5px solid rgba(255,255,255,0.4); border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber-400); margin-bottom: 56px; }
  .headline { font-size: 116px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.92; color: white; text-shadow: 0 8px 40px rgba(0,0,0,0.3); margin-bottom: 28px; }
  .headline .accent { color: var(--amber-400); }
  .sub { font-size: 28px; font-weight: 600; line-height: 1.32; color: rgba(255,255,255,0.92); margin-bottom: 56px; }

  .avatar-row { display: flex; gap: 12px; margin-bottom: 32px; }
  .avatar { width: 86px; height: 86px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: white; border: 4px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }

  .price-block { display: inline-flex; align-items: baseline; gap: 18px; padding: 26px 44px; background: rgba(0,0,0,0.45); backdrop-filter: blur(30px); border: 1.5px solid rgba(255,255,255,0.3); border-radius: 26px; }
  .price-block .price { font-size: 64px; font-weight: 900; letter-spacing: -0.03em; color: var(--amber-400); }
  .price-block .per { font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.85); }
  .price-block .trial { display: block; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-top: 4px; }

  .footer-row { position: absolute; bottom: 100px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; }
  .handle { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.06em; text-transform: uppercase; }
  .freshli-mark { position: absolute; top: 100px; right: 100px; width: 100px; height: 100px; background: rgba(255,255,255,0.95); border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 220px; left: 280px; width: 7px; height: 7px;"></div>
  <div class="sparkle" style="top: 380px; right: 240px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="bottom: 360px; left: 200px; width: 6px; height: 6px;"></div>

  <div style="position:absolute; top:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.45), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-120px; right:-140px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(251,191,36,0.3), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="badge">FRESHLI+ FAMILY</div>
  <div class="headline">One pantry.<br>Six members.<br><span class="accent">Zero waste.</span></div>
  <div class="sub">Synced live across every iPhone, iPad &amp; Apple Watch.</div>

  <div class="avatar-row">
    <div class="avatar" style="background:#16A34A;">S</div>
    <div class="avatar" style="background:#0D9488;">M</div>
    <div class="avatar" style="background:#F59E0B;">L</div>
    <div class="avatar" style="background:#7E22CE;">E</div>
    <div class="avatar" style="background:#E11D48;">J</div>
    <div class="avatar" style="background:rgba(255,255,255,0.2); color:white;">+1</div>
  </div>

  <div class="price-block">
    <div>
      <div><span class="price">£5.99</span><span class="per">/mo</span></div>
      <div class="trial">14-DAY FREE TRIAL · CANCEL ANYTIME</div>
    </div>
  </div>

  <div class="footer-row">
    <div></div>
    <div class="handle">@freshli</div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
