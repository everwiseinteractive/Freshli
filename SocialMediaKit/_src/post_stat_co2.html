<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1080px; }
  .stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; padding: 100px; }
  .badge { display: inline-block; padding: 18px 36px; background: rgba(45,212,191,0.25); backdrop-filter: blur(30px); border: 1.5px solid rgba(45,212,191,0.6); border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal-400); margin-bottom: 56px; }
  .source { font-size: 18px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 24px; }
  .big-number { font-size: 320px; font-weight: 900; letter-spacing: -0.06em; line-height: 0.85; color: white; text-shadow: 0 8px 40px rgba(0,0,0,0.3); margin-bottom: 8px; }
  .big-number .pct { color: var(--teal-400); font-size: 200px; }
  .of-line { font-size: 38px; font-weight: 700; color: white; line-height: 1.2; margin-bottom: 24px; max-width: 720px; }
  .of-line .accent { color: var(--teal-400); }
  .citation { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.7); font-style: italic; }

  .footer-row { position: absolute; bottom: 100px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; }
  .pull { display: inline-flex; align-items: center; gap: 14px; padding: 18px 32px; background: white; border-radius: 999px; font-size: 22px; font-weight: 800; color: var(--green-700); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }
  .handle { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.06em; text-transform: uppercase; }
  .freshli-mark { position: absolute; top: 100px; right: 100px; width: 100px; height: 100px; background: rgba(255,255,255,0.95); border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 200px; left: 280px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="top: 460px; right: 240px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="bottom: 380px; left: 220px; width: 7px; height: 7px;"></div>

  <div style="position:absolute; top:-80px; right:-80px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.45), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-150px; left:-150px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="badge">DID YOU KNOW</div>
  <div class="source">FOOD WASTE = </div>
  <div class="big-number">10<span class="pct">%</span></div>
  <div class="of-line">of <span class="accent">all global emissions</span><br>come from food we throw away.</div>
  <div class="citation">Source: Poore & Nemecek, Science (2018) · FAO 2024</div>

  <div class="footer-row">
    <div class="pull">Track your impact in Freshli ↗</div>
    <div class="handle">@freshli</div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
