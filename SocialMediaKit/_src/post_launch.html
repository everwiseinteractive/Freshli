<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1080px; }
  .stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; padding: 100px; }
  .badge { display: inline-block; padding: 18px 36px; background: rgba(255,255,255,0.18); backdrop-filter: blur(30px); border: 1.5px solid rgba(255,255,255,0.4); border-radius: 999px; font-size: 26px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber-400); margin-bottom: 60px; }
  .headline { font-size: 156px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.88; color: white; text-shadow: 0 8px 40px rgba(0,0,0,0.3); margin-bottom: 36px; }
  .headline .accent { color: var(--amber-400); }
  .sub { font-size: 32px; font-weight: 600; line-height: 1.3; color: rgba(255,255,255,0.92); margin-bottom: 80px; }
  .footer-row { position: absolute; bottom: 100px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; }
  .cta { display: inline-flex; align-items: center; gap: 14px; padding: 20px 36px; background: white; border-radius: 999px; font-size: 26px; font-weight: 800; color: var(--green-700); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
  .cta .arrow { font-size: 28px; }
  .handle { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.06em; text-transform: uppercase; }
  .freshli-mark { position: absolute; top: 100px; right: 100px; width: 100px; height: 100px; background: rgba(255,255,255,0.95); border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 200px; left: 280px; width: 8px; height: 8px;"></div>
  <div class="sparkle" style="top: 380px; right: 260px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="bottom: 380px; left: 220px; width: 7px; height: 7px;"></div>
  <div class="sparkle" style="bottom: 280px; right: 160px; width: 5px; height: 5px;"></div>

  <div style="position:absolute; top:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.45), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-120px; right:-140px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="badge">FRESHLI 1.0 · OUT NOW</div>
  <div class="headline">Rescue food.<br>Save the <span class="accent">planet.</span></div>
  <div class="sub">Apple Intelligence in your kitchen.<br>On-device. Always private. Yours.</div>

  <div class="footer-row">
    <div class="cta">Download on the App Store <span class="arrow">↗</span></div>
    <div class="handle">@freshli</div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
