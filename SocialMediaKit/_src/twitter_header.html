<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1500px; height: 500px; }
  .stage { width: 1500px; height: 500px; position: relative; overflow: hidden; }
  .left { position: absolute; left: 90px; top: 50%; transform: translateY(-50%); width: 720px; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 14px; }
  .title { font-size: 88px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.92; color: white; text-shadow: 0 8px 30px rgba(0,0,0,0.3); margin-bottom: 18px; }
  .title .accent { color: var(--amber-400); }
  .sub { font-size: 26px; font-weight: 600; color: rgba(255,255,255,0.92); letter-spacing: 0.01em; }

  .right { position: absolute; right: 60px; top: 50%; transform: translate(0, -50%); width: 500px; height: 380px; display:flex; align-items:center; justify-content:center; }
  .freshli-mark {
    position: absolute; top: 50px; right: 80px;
    width: 96px; height: 96px;
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .handle { position: absolute; bottom: 40px; left: 90px; font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.02em; }
  .handle .dot { display: inline-block; width: 6px; height: 6px; background: var(--amber-400); border-radius: 50%; margin: 0 14px 4px 0; vertical-align: middle; box-shadow: 0 0 8px var(--amber-400); }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 80px; left: 380px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="top: 180px; left: 220px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="bottom: 100px; left: 540px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="top: 90px; right: 350px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="bottom: 140px; right: 280px; width: 7px; height: 7px;"></div>

  <div style="position:absolute; top:-80px; left:-80px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.45), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-120px; right:-140px; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="left">
    <div class="eyebrow">Freshli — Pantry & Food Saver</div>
    <div class="title">Rescue food.<br>Save the <span class="accent">planet.</span></div>
    <div class="sub">Apple Intelligence in your kitchen. On-device. Private.</div>
  </div>

  <div class="right">
    <svg width="380" height="380" viewBox="0 0 380 380" fill="none">
      <circle cx="190" cy="190" r="170" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <path d="M190 70 C 190 70, 70 110, 70 220 C 70 280, 130 340, 190 340 C 250 340, 310 280, 310 220 C 310 110, 190 70, 190 70 Z" fill="white" opacity="0.95"/>
      <path d="M190 100 C 190 100, 100 130, 100 220 C 100 270, 145 310, 190 310 C 235 310, 280 270, 280 220 C 280 130, 190 100, 190 100 Z" fill="url(#leafGrad2)"/>
      <path d="M190 125 C 184 165, 172 210, 178 260 C 184 295, 195 320, 195 340" stroke="#15803D" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M188 175 Q 210 188 230 195" stroke="#15803D" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M183 230 Q 158 245 145 250" stroke="#15803D" stroke-width="4" stroke-linecap="round" fill="none"/>
      <defs>
        <linearGradient id="leafGrad2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4ADE80"/>
          <stop offset="1" stop-color="#16A34A"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="handle"><span class="dot"></span>@freshli — UK · For the people. For the planet.</div>

  <div class="noise"></div>
</div>
</body></html>
