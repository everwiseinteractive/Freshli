<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1584px; height: 396px; }
  .stage { width: 1584px; height: 396px; position: relative; overflow: hidden; }
  .left { position: absolute; left: 110px; top: 50%; transform: translateY(-50%); width: 850px; }
  .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 12px; }
  .title { font-size: 64px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.96; color: white; text-shadow: 0 8px 30px rgba(0,0,0,0.3); margin-bottom: 14px; }
  .title .accent { color: var(--amber-400); }
  .sub { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.92); }

  .right { position: absolute; right: 90px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 40px; }
  .stat { text-align: center; color: white; }
  .stat .num { font-size: 56px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: var(--amber-400); margin-bottom: 6px; }
  .stat .lbl { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
  .freshli-mark { position: absolute; top: 30px; right: 50px; width: 64px; height: 64px; background: rgba(255,255,255,0.95); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 60px; left: 420px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="bottom: 80px; left: 280px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="top: 60px; right: 380px; width: 5px; height: 5px;"></div>

  <div style="position:absolute; top:-80px; left:-80px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.45), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-100px; right:-120px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="36" height="36" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="left">
    <div class="eyebrow">Freshli — Pantry & Food Saver</div>
    <div class="title">Apple Intelligence in your <span class="accent">kitchen.</span></div>
    <div class="sub">Built in Britain. For the people. For the planet.</div>
  </div>

  <div class="right">
    <div class="stat">
      <div class="num">50K+</div>
      <div class="lbl">Rescuers</div>
    </div>
    <div class="stat">
      <div class="num">1M</div>
      <div class="lbl">Meals Saved</div>
    </div>
    <div class="stat">
      <div class="num">147kg</div>
      <div class="lbl">CO₂ Avoided</div>
    </div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
