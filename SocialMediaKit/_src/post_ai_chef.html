<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1080px; }
  .stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; padding: 100px; }
  .badge { display: inline-flex; align-items: center; gap: 14px; padding: 18px 32px; background: rgba(255,255,255,0.16); backdrop-filter: blur(30px); border: 1.5px solid rgba(167,139,250,0.6); border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: white; margin-bottom: 56px; }
  .ai-spark { width: 24px; height: 24px; background: linear-gradient(135deg, #FBBF24, #2DD4BF, #A78BFA); border-radius: 50%; box-shadow: 0 0 14px rgba(167,139,250,0.7); }
  .headline { font-size: 132px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.92; color: white; text-shadow: 0 8px 40px rgba(0,0,0,0.3); margin-bottom: 32px; }
  .headline .accent { background: linear-gradient(135deg, #FBBF24, #2DD4BF, #A78BFA); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 30px; font-weight: 600; line-height: 1.32; color: rgba(255,255,255,0.92); margin-bottom: 60px; }

  .timer-card { display: inline-flex; align-items: center; gap: 18px; padding: 22px 38px; background: rgba(0,0,0,0.45); backdrop-filter: blur(30px); border: 1.5px solid rgba(167,139,250,0.55); border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 36px; }
  .timer-card .num { font-size: 48px; font-weight: 900; letter-spacing: -0.02em; color: var(--amber-400); }
  .timer-card .lbl { font-size: 18px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.85); }

  .footer-row { position: absolute; bottom: 100px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; }
  .privacy { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; background: rgba(0,0,0,0.45); backdrop-filter: blur(20px); border: 1px solid rgba(167,139,250,0.5); border-radius: 999px; font-size: 18px; font-weight: 700; color: white; letter-spacing: 0.04em; }
  .handle { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.06em; text-transform: uppercase; }
  .freshli-mark { position: absolute; top: 100px; right: 100px; width: 100px; height: 100px; background: rgba(255,255,255,0.95); border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
</style></head><body>
<div class="stage mesh-ai">
  <div class="sparkle" style="top: 220px; left: 200px; width: 8px; height: 8px; box-shadow: 0 0 14px #C4B5FD;"></div>
  <div class="sparkle" style="top: 360px; right: 220px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="bottom: 380px; left: 240px; width: 7px; height: 7px;"></div>
  <div class="sparkle" style="bottom: 280px; right: 200px; width: 6px; height: 6px; box-shadow: 0 0 14px #FBBF24;"></div>

  <div style="position:absolute; top:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(167,139,250,0.5), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-120px; right:-140px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="badge"><span class="ai-spark"></span>Apple Intelligence</div>
  <div class="headline">AI Chef<br>cooks <span class="accent">for you.</span></div>
  <div class="sub">Reads your pantry. Writes recipes for your<br>exact ingredients. Zero cloud.</div>

  <div class="timer-card">
    <div class="num">0.84s</div>
    <div class="lbl">Average recipe generation</div>
  </div>

  <div class="footer-row">
    <div class="privacy">🔒 On-device · No data leaves your iPhone</div>
    <div class="handle">@freshli</div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
