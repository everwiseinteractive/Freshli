<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1080px; }
  .stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; padding: 100px; display: flex; flex-direction: column; justify-content: center; }
  .quote-mark { font-size: 280px; font-weight: 900; line-height: 0.7; color: var(--amber-400); margin-bottom: -40px; opacity: 0.95; }
  .quote { font-size: 76px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: white; text-shadow: 0 8px 30px rgba(0,0,0,0.3); margin-bottom: 56px; }
  .quote .accent { color: var(--amber-400); font-style: italic; }
  .attribution { display: flex; align-items: center; gap: 20px; }
  .attribution .line { width: 56px; height: 4px; background: var(--amber-400); border-radius: 2px; }
  .attribution .text { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.85); }
  .freshli-mark { position: absolute; top: 100px; right: 100px; width: 100px; height: 100px; background: rgba(255,255,255,0.95); border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .handle { position: absolute; bottom: 80px; right: 100px; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase; }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 180px; left: 250px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="bottom: 240px; right: 180px; width: 7px; height: 7px;"></div>

  <div style="position:absolute; top:-80px; right:-80px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(251,191,36,0.3), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-150px; left:-150px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="quote-mark">"</div>
  <div class="quote">For the people.<br><span class="accent">For the planet.</span></div>

  <div class="attribution">
    <div class="line"></div>
    <div class="text">Freshli — Manifesto</div>
  </div>

  <div class="handle">@freshli</div>

  <div class="noise"></div>
</div>
</body></html>
