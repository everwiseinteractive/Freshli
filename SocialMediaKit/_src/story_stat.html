<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1920px; }
  .stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; padding: 280px 90px 200px; }
  .source { font-size: 24px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
  .big-number { font-size: 480px; font-weight: 900; letter-spacing: -0.06em; line-height: 0.85; color: white; text-shadow: 0 8px 40px rgba(0,0,0,0.3); margin-bottom: 12px; }
  .big-number .pct { color: var(--teal-400); font-size: 280px; }
  .of-line { font-size: 48px; font-weight: 800; line-height: 1.16; color: white; margin-bottom: 32px; max-width: 800px; letter-spacing: -0.01em; }
  .of-line .accent { color: var(--teal-400); }
  .citation { font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.7); font-style: italic; margin-bottom: 80px; }
  .pull { display: inline-flex; align-items: center; gap: 14px; padding: 22px 38px; background: white; border-radius: 999px; font-size: 26px; font-weight: 800; color: var(--green-700); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }

  .swipe-up { position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%); }
  .swipe-up .text { font-size: 26px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: white; padding: 16px 38px; background: rgba(255,255,255,0.18); backdrop-filter: blur(30px); border: 1.5px solid rgba(255,255,255,0.4); border-radius: 999px; }
  .freshli-mark { position: absolute; top: 90px; right: 90px; width: 110px; height: 110px; background: rgba(255,255,255,0.95); border-radius: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .handle { position: absolute; top: 90px; left: 90px; padding: 14px 26px; background: rgba(0,0,0,0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; font-size: 22px; font-weight: 700; color: white; letter-spacing: 0.04em; }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 320px; left: 280px; width: 8px; height: 8px;"></div>
  <div class="sparkle" style="top: 520px; right: 240px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="bottom: 580px; left: 240px; width: 7px; height: 7px;"></div>
  <div class="sparkle" style="bottom: 380px; right: 200px; width: 6px; height: 6px;"></div>

  <div style="position:absolute; top:-100px; right:-100px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.45), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-150px; left:-150px; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="handle">@freshli</div>
  <div class="freshli-mark">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="source">FOOD WASTE = </div>
  <div class="big-number">10<span class="pct">%</span></div>
  <div class="of-line">of <span class="accent">all global emissions</span><br>come from food we throw away.</div>
  <div class="citation">Source: Poore & Nemecek, Science (2018)</div>

  <div class="pull">Track your impact ↗</div>

  <div class="swipe-up">
    <div class="text">Tap link in bio ↗</div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
