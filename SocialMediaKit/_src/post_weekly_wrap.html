<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>
  body { width: 1080px; height: 1080px; }
  .stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; padding: 100px; }
  .badge { display: inline-block; padding: 18px 32px; background: rgba(255,255,255,0.18); backdrop-filter: blur(30px); border: 1.5px solid rgba(255,255,255,0.4); border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: white; margin-bottom: 36px; }
  .week { font-size: 24px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 60px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 48px; }
  .stat { padding: 36px 40px; background: rgba(255,255,255,0.10); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.25); border-radius: 28px; }
  .stat .num { font-size: 88px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; color: white; margin-bottom: 8px; }
  .stat .num .unit { font-size: 36px; font-weight: 700; opacity: 0.85; }
  .stat .lbl { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.75); }
  .stat.gold .num { color: var(--amber-400); }
  .stat.teal .num { color: var(--teal-400); }
  .summary { font-size: 28px; font-weight: 700; line-height: 1.34; color: white; }
  .summary .accent { color: var(--amber-400); }

  .footer-row { position: absolute; bottom: 100px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; }
  .handle { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.06em; text-transform: uppercase; }
  .cta { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; font-size: 18px; font-weight: 700; color: white; }
  .freshli-mark { position: absolute; top: 100px; right: 100px; width: 100px; height: 100px; background: rgba(255,255,255,0.95); border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
</style></head><body>
<div class="stage mesh-green">
  <div class="sparkle" style="top: 200px; left: 240px; width: 7px; height: 7px;"></div>
  <div class="sparkle" style="bottom: 320px; right: 220px; width: 6px; height: 6px;"></div>

  <div style="position:absolute; top:-80px; right:-80px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(251,191,36,0.3), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-120px; left:-150px; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="badge">⭐ WEEKLY WRAP</div>
  <div class="week">WEEK 17 · 21 — 27 APR</div>

  <div class="stats-grid">
    <div class="stat gold">
      <div class="num">£42</div>
      <div class="lbl">Money Saved</div>
    </div>
    <div class="stat teal">
      <div class="num">14<span class="unit"> kg</span></div>
      <div class="lbl">CO₂ Avoided</div>
    </div>
    <div class="stat">
      <div class="num">23</div>
      <div class="lbl">Meals Rescued</div>
    </div>
    <div class="stat">
      <div class="num">7</div>
      <div class="lbl">Day Streak</div>
    </div>
  </div>

  <div class="summary">That's <span class="accent">582 km not driven.</span><br>Cinematic recap. Built to share.</div>

  <div class="footer-row">
    <div class="cta">📱 Open Freshli to see yours</div>
    <div class="handle">@freshli</div>
  </div>

  <div class="noise"></div>
</div>
</body></html>
