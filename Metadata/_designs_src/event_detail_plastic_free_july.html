<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plastic Free July — Event Detail</title>
<link rel="stylesheet" href="freshli.css">
<style>
  body { width: 1920px; height: 1080px; }
  .stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; }

  .left {
    position: absolute; left: 110px; top: 50%; transform: translateY(-50%);
    width: 880px;
  }
  .right {
    position: absolute; right: 110px; top: 50%; transform: translateY(-50%);
    width: 720px; height: 720px;
    display: flex; align-items: center; justify-content: center;
  }

  .badge-pill {
    display: inline-block;
    padding: 16px 32px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(30px);
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--teal-400);
    margin-bottom: 36px;
  }

  .title-eyebrow {
    font-size: 26px; font-weight: 600; letter-spacing: 0.42em;
    color: rgba(255,255,255,0.85);
    margin-bottom: 18px;
  }
  .title-main {
    font-size: 156px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.88;
    color: white;
    text-shadow: 0 8px 40px rgba(0,0,0,0.4);
    margin-bottom: 32px;
  }
  .title-main .accent { color: var(--teal-400); }
  .title-sub {
    font-size: 36px; font-weight: 600;
    color: rgba(255,255,255,0.92);
    line-height: 1.32;
    margin-bottom: 48px;
    letter-spacing: 0.01em;
  }

  .stats { display: flex; gap: 36px; margin-bottom: 24px; }
  .stat {
    flex: 1;
    padding: 24px 28px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 22px;
  }
  .stat-num {
    font-size: 48px; font-weight: 900; letter-spacing: -0.03em;
    color: var(--teal-400); margin-bottom: 4px;
  }
  .stat-lbl {
    font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.75);
    letter-spacing: 0.04em;
  }

  .freshli-mark {
    position: absolute; top: 50px; right: 50px;
    width: 88px; height: 88px;
    background: rgba(255,255,255,0.95);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
<div class="stage mesh-teal">
  <!-- Sparkles -->
  <div class="sparkle" style="top: 110px; left: 380px; width: 6px; height: 6px;"></div>
  <div class="sparkle" style="top: 220px; left: 120px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="top: 380px; left: 520px; width: 7px; height: 7px;"></div>
  <div class="sparkle" style="bottom: 140px; left: 880px; width: 5px; height: 5px;"></div>
  <div class="sparkle" style="top: 120px; right: 320px; width: 4px; height: 4px;"></div>
  <div class="sparkle" style="bottom: 200px; right: 220px; width: 6px; height: 6px;"></div>

  <!-- Decorative orbs -->
  <div style="position:absolute; top:-80px; left:-80px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(45,212,191,0.4), transparent 70%); filter:blur(2px);"></div>
  <div style="position:absolute; bottom:-100px; right:-120px; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(74,222,128,0.4), transparent 70%); filter:blur(2px);"></div>

  <div class="freshli-mark">
    <svg width="52" height="52" viewBox="0 0 64 64" fill="none">
      <path d="M32 8C32 8 18 14 18 32C18 44 26 56 32 56C38 56 46 44 46 32C46 14 32 8 32 8Z" fill="#22C55E"/>
      <path d="M32 14C32 14 24 30 32 50" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="left">
    <div class="badge-pill">31-DAY CHALLENGE</div>
    <div class="title-eyebrow">JULY 1 – 31 · 2026</div>
    <div class="title-main">Plastic Free<br><span class="accent">July</span>.</div>
    <div class="title-sub">Rescue food. Refuse plastic.<br>Earn the Plastic-Free Hero badge.</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">31</div>
        <div class="stat-lbl">DAILY MISSIONS</div>
      </div>
      <div class="stat">
        <div class="stat-num">+2×</div>
        <div class="stat-lbl">KARMA BONUS</div>
      </div>
      <div class="stat">
        <div class="stat-num">∞</div>
        <div class="stat-lbl">PLANETS SAVED</div>
      </div>
    </div>
  </div>

  <div class="right">
    <!-- Glass jar -->
    <svg width="640" height="780" viewBox="0 0 640 780" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Lid -->
      <rect x="120" y="80" width="400" height="84" rx="16" fill="url(#lidGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
      <rect x="120" y="80" width="400" height="20" rx="8" fill="rgba(255,255,255,0.45)"/>

      <!-- Body -->
      <path d="M100 180 Q100 168 114 168 L526 168 Q540 168 540 180 L540 696 Q540 752 478 752 L162 752 Q100 752 100 696 Z"
            fill="url(#jarGrad)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
      <!-- Highlight -->
      <path d="M132 200 L132 680 Q132 706 158 706" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M180 200 L180 280" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Food items -->
      <!-- Tomato -->
      <circle cx="200" cy="560" r="50" fill="#EF5350"/>
      <path d="M200 510 Q210 504 220 514" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
      <!-- Lemon -->
      <ellipse cx="320" cy="585" rx="48" ry="40" fill="#FBBF24"/>
      <!-- Carrot top -->
      <ellipse cx="430" cy="580" rx="40" ry="38" fill="#F5923E"/>
      <path d="M412 542 L420 524 M430 538 L432 520 M448 542 L452 524" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
      <!-- Avocado -->
      <ellipse cx="245" cy="465" rx="40" ry="50" fill="#86EFAC"/>
      <circle cx="245" cy="465" r="14" fill="#15803D"/>
      <!-- Apple -->
      <circle cx="385" cy="465" r="44" fill="#22C55E"/>
      <path d="M385 423 Q389 418 396 423" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
      <!-- Berries row -->
      <circle cx="170" cy="660" r="22" fill="#E11D48"/>
      <circle cx="220" cy="680" r="20" fill="#7E22CE"/>
      <circle cx="278" cy="668" r="22" fill="#E11D48"/>
      <circle cx="340" cy="680" r="20" fill="#7E22CE"/>
      <circle cx="400" cy="668" r="22" fill="#E11D48"/>
      <circle cx="460" cy="680" r="19" fill="#7E22CE"/>

      <!-- Floating leaf -->
      <path d="M500 290 Q525 282 532 308 Q525 326 500 314 Z" fill="#4ADE80" opacity="0.9"/>
      <path d="M500 290 Q516 304 532 308" stroke="#15803D" stroke-width="3" fill="none"/>

      <!-- Label -->
      <rect x="220" y="350" width="200" height="56" rx="8" fill="rgba(255,255,255,0.92)"/>
      <text x="320" y="386" text-anchor="middle" font-family="-apple-system" font-size="28" font-weight="800" fill="#0D9488" letter-spacing="2.5">PLASTIC FREE</text>

      <defs>
        <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0D9488"/>
          <stop offset="1" stop-color="#14B8A6"/>
        </linearGradient>
        <linearGradient id="jarGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgba(255,255,255,0.18)"/>
          <stop offset="1" stop-color="rgba(255,255,255,0.06)"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="noise"></div>
</div>
</body>
</html>
